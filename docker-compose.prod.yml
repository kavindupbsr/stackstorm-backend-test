# ==============================================================================
# Production Docker Compose Orchestration for StackStorm Platform
# Dickwella Fashion Corner - Hardened Multi-Tier Deployment Topology
# ==============================================================================

version: '3.8'

services:
  # Edge Reverse Proxy & Static Assets Gateway
  nginx:
    image: nginx:1.27-alpine
    container_name: stackstorm_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stackstorm_network

  # Core Backend Application Service (Express 5.1 & Socket.IO)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: stackstorm_backend_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stackstorm_prod
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_jwt_access_secret_dickwella_fashion_corner_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_dickwella_fashion_corner_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stackstorm_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Relational Database Service (PostgreSQL 17)
  postgres:
    image: postgres:17-alpine
    container_name: stackstorm_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: stackstorm_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - stackstorm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackstorm_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # In-Memory Cache, Rate Limiter & Message Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: stackstorm_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_prod_data:/data
    networks:
      - stackstorm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  stackstorm_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
